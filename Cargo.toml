[package]
name = "untechxt"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
authors = ["Philippe Faist"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/phfaist/untechxt"
description = "Encode Unicode text as LaTeX source, and learn what the document preamble needs. Fast, extensible, no_std + alloc."
readme = "README.md"
keywords = ["latex", "unicode", "encoding", "text-processing", "no-std"]
categories = ["text-processing", "encoding", "no-std"]
# Reference-only material, the one-off migration script, and the CI setup stay
# out of the published package.
exclude = ["/initial-rust-port", "/tools", "/PLAN.md", "/CLAUDE.md", "/.github"]

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"

[lib]
# The library has no benchmarks of its own, and `cargo bench` would otherwise
# run its libtest harness first, which rejects criterion's options.
bench = false

[profile.release]
lto = true
codegen-units = 1

[features]
default = ["std"]
# The `std` feature only adds the `std::io::Write` output adapter.
std = []

[dependencies]
# unicode-normalization for NFC decomposition etc. default-features=false so we
# have no_std+alloc support.
unicode-normalization = { version = "0.1", default-features = false }

[dev-dependencies]
# Benchmarks only. No default features: `plotters` and `rayon` come with them,
# and this crate's benchmarks want neither HTML reports nor a thread pool.
criterion = { version = "0.5", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "encode"
harness = false
